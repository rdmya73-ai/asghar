<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اصغر بات | پو سایبرپانکی</title>
<style>
  :root {
    --bg-dark: #070913;
    --neon-blue: #00f3ff;
    --neon-pink: #ff0055;
    --neon-green: #00ff66;
    --gold: #ffb703;
    --panel-bg: #0c1020;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, Tahoma, sans-serif;
  }

  body {
    background: #020307;
    color: #fff;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  #game-container {
    width: 100%;
    max-width: 450px;
    height: 100vh;
    background: radial-gradient(circle at center, #161c36 0%, #070913 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* نوار بالای صفحه */
  .top-bar {
    padding: 10px 14px;
    background: rgba(10, 14, 28, 0.95);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1a2240;
    z-index: 10;
  }
  .coins-badge {
    color: var(--gold);
    font-weight: bold;
    font-size: 15px;
  }

  /* شاخص‌های زنده */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 8px 10px;
    background: #0d1224;
    border-bottom: 1px solid #161c36;
    z-index: 10;
  }
  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #9aa8cc;
  }
  .stat-bar-bg {
    width: 100%;
    height: 7px;
    background: #1c2444;
    border-radius: 4px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    width: 80%;
    transition: width 0.3s ease;
  }

  /* استیج اصلی */
  #main-stage {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .room-header {
    position: absolute;
    top: 14px;
    font-weight: bold;
    font-size: 14px;
    color: #8fa0d4;
    z-index: 10;
  }

  .room-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #121830;
    border: 2px solid var(--neon-blue);
    color: var(--neon-blue);
    font-size: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 15;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .room-nav-btn:active {
    transform: translateY(-50%) scale(0.9);
  }

  /* اصغر بات */
  #asghar-container {
    position: relative;
    width: 210px;
    height: 240px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 5;
    animation: idleBreath 3s infinite ease-in-out;
  }

  @keyframes idleBreath {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.02, 0.98) translateY(5px); }
  }

  .speech-bubble {
    position: absolute;
    top: -40px;
    background: #ffffff;
    color: #0b0d18;
    padding: 7px 14px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    pointer-events: none;
    z-index: 20;
    max-width: 240px;
  }

  /* ابزار گوشه اتاق */
  .draggable-item {
    position: absolute;
    width: 58px;
    height: 58px;
    background: #161e38;
    border: 2px solid var(--neon-blue);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    cursor: grab;
    z-index: 15;
    bottom: 20px;
    right: 20px;
    box-shadow: 0 4px 14px rgba(0, 243, 255, 0.3);
  }

  /* نوار انتخاب آیتم */
  .action-deck {
    padding: 10px;
    display: flex;
    gap: 8px;
    justify-content: center;
    background: #0b0f1f;
    border-top: 1px solid #161c36;
    z-index: 10;
  }
  .item-slot {
    background: #151b36;
    border: 1px solid #232d59;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    font-size: 11px;
    min-width: 75px;
  }
  .item-slot.selected {
    border-color: var(--neon-blue);
    background: #1e284f;
  }

  /* تب‌های ناوبری اصلی */
  .nav-tabs {
    display: flex;
    background: #060810;
    border-top: 1px solid #141a33;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 13px 4px;
    background: none;
    border: none;
    color: #7b8ab3;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active {
    color: var(--neon-blue);
    border-bottom-color: var(--neon-blue);
    background: rgba(0, 243, 255, 0.05);
  }

  /* پنجره‌های پاپ‌آپ */
  .overlay-panel {
    position: absolute;
    top: 50px;
    bottom: 48px;
    left: 0;
    right: 0;
    background: var(--panel-bg);
    z-index: 30;
    display: none;
    flex-direction: column;
  }
  .overlay-panel.show {
    display: flex;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #1b2342;
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  /* چت */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .msg-asghar { background: #1a2240; align-self: flex-start; }
  .msg-user { background: var(--neon-pink); align-self: flex-end; }
  .chat-input-area {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid #1b2342;
    background: #090c17;
  }
  .chat-input {
    flex: 1;
    background: #141b33;
    border: 1px solid #232e57;
    color: #fff;
    padding: 9px 12px;
    border-radius: 8px;
    outline: none;
  }

  /* گرید ۵۰ بازی */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .game-card {
    background: #121830;
    border: 1px solid #1e274c;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
  }
  .game-card:active {
    background: #1b2447;
  }

  /* افکت شناور */
  .floating-fx {
    position: absolute;
    pointer-events: none;
    animation: floatUp 0.9s forwards ease-out;
    font-size: 26px;
    z-index: 50;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 1; }
    100% { transform: translateY(-70px) scale(1.2); opacity: 0; }
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- نوار بالا -->
  <div class="top-bar">
    <div class="coins-badge">🪙 <span id="coin-txt">1500</span></div>
    <div style="font-weight:bold; color:var(--neon-blue);">🦾 اصغر بات زنده</div>
    <div style="background:var(--neon-pink); padding:2px 8px; border-radius:10px; font-size:12px; font-weight:bold;">سطح <span id="lvl-txt">1</span></div>
  </div>

  <!-- نوار وضعیت‌ها -->
  <div class="stats-grid">
    <div class="stat-box">
      <span>⚡ باتری</span>
      <div class="stat-bar-bg"><div id="bar-energy" class="stat-bar-fill" style="background:#00ff66;"></div></div>
    </div>
    <div class="stat-box">
      <span>🛢️ سوخت</span>
      <div class="stat-bar-bg"><div id="bar-food" class="stat-bar-fill" style="background:#ffb703;"></div></div>
    </div>
    <div class="stat-box">
      <span>🧼 کارواش</span>
      <div class="stat-bar-bg"><div id="bar-clean" class="stat-bar-fill" style="background:#00f3ff;"></div></div>
    </div>
    <div class="stat-box">
      <span>🕶️ لاتی</span>
      <div class="stat-bar-bg"><div id="bar-swag" class="stat-bar-fill" style="background:#ff0055;"></div></div>
    </div>
  </div>

  <!-- صحنه اصلی اصغر -->
  <div id="main-stage">
    <button class="room-nav-btn" style="right:10px;" id="btn-next-room">❯</button>
    <button class="room-nav-btn" style="left:10px;" id="btn-prev-room">❮</button>

    <div class="room-header" id="room-name">🛋️ سالن گنگ و استراحت</div>

    <!-- بدنه SVG اصغر -->
    <div id="asghar-container">
      <div class="speech-bubble" id="asghar-bubble">به مولا چاکریم کاکو! 🗿🥃</div>
      <svg width="210" height="240" viewBox="0 0 220 250">
        <line x1="110" y1="20" x2="110" y2="48" stroke="#00f3ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="110" cy="18" r="7" fill="#ff0055"/>
        <rect x="20" y="85" width="16" height="45" rx="6" fill="#00f3ff"/>
        <rect x="184" y="85" width="16" height="45" rx="6" fill="#00f3ff"/>
        
        <path d="M 52 205 C 15 170, 35 55, 110 50 C 185 55, 205 170, 168 205 C 145 230, 75 230, 52 205 Z" 
              fill="#222b47" stroke="#3d4973" stroke-width="4"/>

        <!-- لپ‌ها -->
        <ellipse id="blush-l" cx="55" cy="145" rx="12" ry="7" fill="#ff0055" opacity="0.1"/>
        <ellipse id="blush-r" cx="165" cy="145" rx="12" ry="7" fill="#ff0055" opacity="0.1"/>

        <!-- چشم‌ها -->
        <g id="eyes">
          <rect x="58" y="90" width="38" height="34" rx="8" fill="#070a14" stroke="#00f3ff" stroke-width="2"/>
          <circle id="pupil-l" cx="77" cy="107" r="7" fill="#00f3ff"/>
          <rect x="124" y="90" width="38" height="34" rx="8" fill="#070a14" stroke="#00f3ff" stroke-width="2"/>
          <circle id="pupil-r" cx="143" cy="107" r="7" fill="#00f3ff"/>
          <rect id="eyelid-l" x="58" y="90" width="38" height="0" fill="#222b47"/>
          <rect id="eyelid-r" x="124" y="90" width="38" height="0" fill="#222b47"/>
        </g>

        <!-- دهان -->
        <path id="mouth" d="M 85 155 Q 110 165 135 155" stroke="#ff0055" stroke-width="4" stroke-linecap="round" fill="none"/>
        <text x="110" y="196" font-size="16" text-anchor="middle">🦾</text>
      </svg>
    </div>

    <!-- ابزار با کلیک یا کشیدن -->
    <div id="drag-tool" class="draggable-item">🩴</div>
  </div>

  <!-- نوار آیتم‌های اتاق -->
  <div class="action-deck" id="item-deck"></div>

  <!-- تب‌های پایین -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-home">🏠 خانه</button>
    <button class="tab-btn" id="tab-chat">💬 چت لاتی</button>
    <button class="tab-btn" id="tab-games">🎮 ۵۰ بازی</button>
    <button class="tab-btn" id="tab-features">⚙️ ۵۰ امکانات</button>
  </div>

  <!-- پنل چت -->
  <div class="overlay-panel" id="panel-chat">
    <div class="panel-header">
      <span style="font-weight:bold;">💬 گپ با اصغر 🗿🥃</span>
      <button class="close-btn" data-panel="panel-chat" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="chat-messages" id="chat-msgs">
      <div class="msg msg-asghar">به نام حق! چه خبره کاکو؟ بنال چایی برات بریزم یا دمپایی می‌خوای؟ 🗿</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-in" class="chat-input" placeholder="یه چیزی بهش بگو...">
      <button id="btn-send-chat" style="background:var(--neon-pink); border:none; border-radius:8px; padding:0 14px; color:#fff; font-weight:bold; cursor:pointer;">بفرست</button>
    </div>
  </div>

  <!-- پنل ۵۰ بازی -->
  <div class="overlay-panel" id="panel-games">
    <div class="panel-header">
      <span style="font-weight:bold;">🎮 ۵۰ مینی‌گیم اصغر</span>
      <button class="close-btn" data-panel="panel-games" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="panel-body">
      <div class="games-grid" id="games-grid"></div>
    </div>
  </div>

  <!-- پنل ۵۰ ارتقا -->
  <div class="overlay-panel" id="panel-features">
    <div class="panel-header">
      <span style="font-weight:bold;">⚙️ ۵۰ قطعه و ارتقای بدنه</span>
      <button class="close-btn" data-panel="panel-features" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
    </div>
    <div class="panel-body" id="features-list" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>
</div>

<script>
  /* --- موتور تولید صوت داخلی --- */
  let audioCtx = null;
  function beep(freq, duration = 0.1) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(0.1, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  /* --- دیتای اتاق‌ها --- */
  const state = {
    coins: 1500,
    level: 1,
    energy: 90,
    food: 80,
    clean: 85,
    swag: 95,
    roomIdx: 0
  };

  const rooms = [
    {
      name: "🛋️ سالن گنگ و استراحت",
      items: [
        { icon: "🩴", name: "دمپایی ابری", type: "slap", desc: "دمپایی افسانه‌ای 🩴" },
        { icon: "🥃", name: "چای دبش", type: "tea", desc: "چای داغ مشتی ☕" },
        { icon: "🦦", name: "سمور آرامش", type: "pet", desc: "نوازش کاکو 🦦" }
      ]
    },
    {
      name: "🍳 آشپزخانه و باک بنزین",
      items: [
        { icon: "🛢️", name: "روغن موتور", type: "food", val: 30, desc: "سوخت اعلای ۴ زمانه 🛢️" },
        { icon: "🔋", name: "باتری اتمی", type: "food", val: 35, desc: "خوراک آمپر بالا ⚡" },
        { icon: "🍕", name: "پیتزای چیپست", type: "food", val: 25, desc: "خوشمزه و روغنی 🍕" }
      ]
    },
    {
      name: "🚿 کارواش و ضدزنگ",
      items: [
        { icon: "🧼", name: "صابون مراغه", type: "wash", val: 30, desc: "برق انداختن تیتانیوم 🧼" },
        { icon: "🧽", name: "اسکاچ سیمی", type: "wash", val: 25, desc: "ضد خش و ضد زنگ ✨" }
      ]
    },
    {
      name: "🛏️ شارژرخانه و اورکلاک",
      items: [
        { icon: "⚡", name: "شارژر ۳فاز", type: "charge", val: 40, desc: "شارژ سوپرفست 🔌" },
        { icon: "🔥", name: "کپسول نیترو", type: "nitro", val: 50, desc: "اورکلاک سی‌پی‌یو 🔥" }
      ]
    }
  ];

  let currentItem = rooms[0].items[0];

  /* --- شروع بازی پس از لود کامل صفحه --- */
  window.addEventListener('load', () => {
    updateUI();
    renderItemDeck();
    setupEyeTracking();
    setupPetting();
    setupDragDrop();
    startBlinking();
    init50Games();
    init50Features();

    // کلیدهای جابجایی اتاق
    document.getElementById('btn-next-room').onclick = () => changeRoom(1);
    document.getElementById('btn-prev-room').onclick = () => changeRoom(-1);

    // تب‌ها
    document.getElementById('tab-home').onclick = () => showPanel(null);
    document.getElementById('tab-chat').onclick = () => showPanel('panel-chat');
    document.getElementById('tab-games').onclick = () => showPanel('panel-games');
    document.getElementById('tab-features').onclick = () => showPanel('panel-features');

    // کلید ضربدر بستن پنل‌ها
    document.querySelectorAll('.close-btn').forEach(btn => {
      btn.onclick = () => showPanel(null);
    });

    // چت لاتی
    document.getElementById('btn-send-chat').onclick = sendChat;
    document.getElementById('chat-in').onkeypress = (e) => {
      if (e.key === 'Enter') sendChat();
    };

    // کلیک مستقیم روی ابزار
    document.getElementById('drag-tool').onclick = () => applyEffect(currentItem);
  });

  function updateUI() {
    document.getElementById('coin-txt').innerText = state.coins;
    document.getElementById('lvl-txt').innerText = state.level;
    document.getElementById('bar-energy').style.width = state.energy + '%';
    document.getElementById('bar-food').style.width = state.food + '%';
    document.getElementById('bar-clean').style.width = state.clean + '%';
    document.getElementById('bar-swag').style.width = state.swag + '%';
  }

  function changeRoom(dir) {
    beep(400);
    state.roomIdx = (state.roomIdx + dir + rooms.length) % rooms.length;
    const r = rooms[state.roomIdx];
    document.getElementById('room-name').innerText = r.name;
    currentItem = r.items[0];
    document.getElementById('drag-tool').innerText = currentItem.icon;
    renderItemDeck();
  }

  function renderItemDeck() {
    const deck = document.getElementById('item-deck');
    deck.innerHTML = '';
    rooms[state.roomIdx].items.forEach(it => {
      const slot = document.createElement('div');
      slot.className = `item-slot ${it.name === currentItem.name ? 'selected' : ''}`;
      slot.innerHTML = `<span style="font-size:20px;">${it.icon}</span><span>${it.name}</span>`;
      slot.onclick = () => {
        beep(500);
        currentItem = it;
        document.getElementById('drag-tool').innerText = it.icon;
        renderItemDeck();
        speak(it.desc);
      };
      deck.appendChild(slot);
    });
  }

  /* --- سیستم چشم و انیمیشن --- */
  function setupEyeTracking() {
    const pL = document.getElementById('pupil-l');
    const pR = document.getElementById('pupil-r');
    const move = (clientX, clientY) => {
      const b = document.getElementById('asghar-container').getBoundingClientRect();
      const cx = b.left + b.width / 2;
      const cy = b.top + 107;
      const angle = Math.atan2(clientY - cy, clientX - cx);
      const dist = Math.min(5, Math.hypot(clientX - cx, clientY - cy) / 25);
      const ox = Math.cos(angle) * dist;
      const oy = Math.sin(angle) * dist;
      pL.setAttribute('cx', 77 + ox);
      pL.setAttribute('cy', 107 + oy);
      pR.setAttribute('cx', 143 + ox);
      pR.setAttribute('cy', 107 + oy);
    };
    window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      if (e.touches && e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
  }

  function startBlinking() {
    setInterval(() => {
      const l = document.getElementById('eyelid-l');
      const r = document.getElementById('eyelid-r');
      l.setAttribute('height', '34');
      r.setAttribute('height', '34');
      setTimeout(() => {
        l.setAttribute('height', '0');
        r.setAttribute('height', '0');
      }, 150);
    }, 3800);
  }

  function setupPetting() {
    const el = document.getElementById('asghar-container');
    let cnt = 0;
    const pet = () => {
      cnt++;
      if (cnt > 8) {
        cnt = 0;
        beep(700);
        state.swag = Math.min(100, state.swag + 8);
        updateUI();
        speak("قلقلکم نده کاکو اتصالی زدم! 😂💋");
        showFx('💋');
      }
    };
    el.addEventListener('mousemove', pet);
    el.addEventListener('touchmove', pet, { passive: true });
    el.onclick = () => applyEffect(currentItem);
  }

  /* --- سیستم Drag & Drop بدون اختلال تاچ --- */
  function setupDragDrop() {
    const tool = document.getElementById('drag-tool');
    let active = false;
    let ox = 0, oy = 0;

    const start = (e) => {
      active = true;
      const p = e.touches ? e.touches[0] : e;
      ox = p.clientX - tool.offsetLeft;
      oy = p.clientY - tool.offsetTop;
      tool.style.transition = 'none';
    };
